<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HFX Model Inspector · Phase 16</title><style>
:root{color-scheme:dark;--line:#30435e;--muted:#a9b7cc;--cyan:#a5eaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#27315c,#080b13 55%);color:#f6f8ff;font:14px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:14px}.panel{background:#111827ed;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:12px}.stage{height:min(65vh,640px);min-height:320px;background:#030712;border-radius:11px;overflow:hidden}.stage canvas{width:100%;height:100%;display:block}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}button,input[type=file]{background:#263750;color:white;border:1px solid #435a7a;border-radius:9px;padding:10px}button{font-weight:850}.status{white-space:pre-wrap;background:#08111d;border:1px solid #334a65;border-radius:9px;padding:10px;color:#b9e8ff}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#0b1321;border:1px solid #344760;border-radius:9px;padding:10px}.card b{display:block;color:#e6f7ff}.muted{color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.stage{height:50vh;min-height:280px}}@media(max-width:400px){.cards{grid-template-columns:1fr}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><main><h1>HFX Phase 16 · 3D Asset Inspector</h1><p class="muted">Inspect a self-contained GLB locally before production. No asset uploads.</p><section class="panel"><input id="file" type="file" accept=".glb,model/gltf-binary"><div class="buttons"><button id="reset">Reset view</button><button id="report">Export inspection JSON</button></div><div id="status" class="status">Choose a GLB file.</div></section><div class="layout"><section class="panel"><h2>Real model preview</h2><div id="stage" class="stage"></div><p class="muted">Drag to orbit; pinch/wheel to zoom.</p></section><section class="panel"><h2>Asset facts</h2><div id="cards" class="cards"></div><h3>Validation notes</h3><div id="checks" class="status">No model loaded.</div></section></div></main><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),stage=$('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x030712);const camera=new THREE.PerspectiveCamera(38,1,.01,1000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;stage.append(renderer.domElement);const ctl=new OrbitControls(camera,renderer.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xcbdcff,0x263044,2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(3,5,4);scene.add(key);const rim=new THREE.DirectionalLight(0x91baff,2);rim.position.set(-4,3,-4);scene.add(rim);let obj=null,data=null;
function size(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(size).observe(stage);size();function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,camera)}loop();
function frame(o){const box=new THREE.Box3().setFromObject(o),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z);o.position.sub(c);camera.position.set(m*1.5,m*1.1,m*1.8);camera.near=Math.max(.001,m/1000);camera.far=m*100;camera.updateProjectionMatrix();ctl.target.set(0,0,0);ctl.minDistance=m*.4;ctl.maxDistance=m*10;ctl.update();return s}
function inspect(g,f){let meshes=0,tri=0,mats=new Set(),tex=new Set();g.traverse(o=>{if(o.isMesh){meshes++;const geo=o.geometry;tri+=geo.index?geo.index.count/3:(geo.attributes.position?.count||0)/3;for(const m of(Array.isArray(o.material)?o.material:[o.material]))if(m){mats.add(m);for(const k of['map','normalMap','roughnessMap','metalnessMap','emissiveMap','alphaMap'])if(m[k])tex.add(m[k])}}});const b=new THREE.Box3().setFromObject(g).getSize(new THREE.Vector3());return{file:f.name,size_bytes:f.size,meshes,triangles:Math.round(tri),materials:mats.size,texture_maps:tex.size,animation_clips:g.animations.length,dimensions:{x:b.x,y:b.y,z:b.z}}}
function show(d){const list=[['Triangles',d.triangles.toLocaleString()],['Meshes',d.meshes],['Materials',d.materials],['Texture maps',d.texture_maps],['Animations',d.animation_clips],['Dimensions',Object.values(d.dimensions).map(v=>v.toFixed(3)).join(' × ')+' units']];$('cards').innerHTML=list.map(([a,b])=>'<div class="card"><b>'+a+'</b>'+b+'</div>').join('');$('checks').textContent='GLB size: '+(d.size_bytes<=100*1024*1024?'PASS':'WARN')+' · '+(d.size_bytes/1048576).toFixed(2)+' MB (100 MB exporter limit)\nGeometry: '+(d.meshes?'PASS':'FAIL')+' · '+d.meshes+' meshes / '+d.triangles+' triangles\nMaterials: '+(d.materials?'PASS':'WARN')+' · '+d.materials+'\nTexture maps: '+(d.texture_maps?'PASS':'WARN')+' · '+d.texture_maps+'\nHuman visual checks still required: product shape, color, camera layout, screen/back, details and scale.'}
$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.glb'))return $('status').textContent='This phase expects a self-contained GLB.';if(obj)scene.remove(obj);$('status').textContent='Loading…';const url=URL.createObjectURL(f);try{const gltf=await new GLTFLoader().loadAsync(url);obj=gltf.scene;scene.add(obj);const bounds=frame(obj);data=inspect(gltf,f);data.dimensions={x:bounds.x,y:bounds.y,z:bounds.z};show(data);$('status').textContent='Loaded and inspected: '+f.name+' · file stays in this browser.'}catch(err){data=null;$('status').textContent='Load error: '+err.message}finally{URL.revokeObjectURL(url)}};$('reset').onclick=()=>obj&&frame(obj);$('report').onclick=()=>{if(!data)return alert('Load a model first');const blob=new Blob([JSON.stringify({tool:'HFX Phase 16 Model Inspector',scope:'local technical metadata; visual authenticity human-reviewed',created_at:new Date().toISOString(),inspection:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hfx-model-inspection.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
