<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFX Asset Quality Gate · Phase 14</title><style>
:root{color-scheme:dark;--bg:#080b13;--panel:#121a29;--line:#30435e;--accent:#a5eaff;--muted:#a9b7cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#27315c,#080b13 55%);color:#f6f8ff;font:14px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:15px}.panel{background:#111827ed;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.head{display:flex;gap:12px;align-items:center}.mark{padding:10px;border-radius:12px;background:linear-gradient(135deg,#a5eaff,#c2aaff);color:#07101a;font-weight:950}.eyebrow{color:var(--accent);font-size:10px;font-weight:850;letter-spacing:.15em}h1{margin:0;font-size:22px}.muted{color:var(--muted)}input[type=file]{width:100%;padding:10px;border-radius:9px;background:#07101c;color:white;border:1px solid #344760}button{background:linear-gradient(100deg,#a5eaff,#c2aaff);color:#07101a;border:0;border-radius:9px;padding:10px 13px;font-weight:850;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid #344760;background:#0b1321;border-radius:10px;padding:10px}.card img{width:100%;height:180px;object-fit:contain;background:#02050a;border-radius:7px}.status{background:#08111d;border:1px solid #334a65;border-radius:9px;padding:10px;white-space:pre-wrap}.small{font-size:11px;color:var(--muted)}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}@media(max-width:480px){main{padding:10px}}
</style></head><body><main><div class="head"><div class="mark">HFX</div><div><div class="eyebrow">PHASE 14 · ASSET QUALITY GATE</div><h1>Reference Asset Inspector</h1></div></div><p class="muted">Check resolution, aspect ratio, file size and exact duplicates before building an ad. Everything is inspected locally in this browser.</p><div class="panel"><label><b>Import images (select multiple)</b></label><input type="file" id="files" accept="image/*" multiple><div class="buttons"><button id="report">Download QC JSON</button><button id="clear">Clear report</button></div><div class="status" id="status">Waiting for files.</div></div><div class="grid" id="cards"></div></main><script>
const $=id=>document.getElementById(id);let report=[];function classify(w,h){const r=w/h;if(w<720||h<720)return'LOW RES';if(r<.65||r>1.9)return'EXTREME ASPECT';if(w>=1080&&h>=1080)return'GOOD';return'REVIEW'}function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}async function hash(file){const b=await file.arrayBuffer();const digest=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}function loadImage(src){return new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
$('files').onchange=async e=>{report=[];$('cards').innerHTML='';const files=[...e.target.files];for(const f of files){try{const src=URL.createObjectURL(f),im=await loadImage(src),h=await hash(f);const dup=report.find(x=>x.sha256===h);const entry={file:f.name,width:im.naturalWidth,height:im.naturalHeight,ratio:Number((im.naturalWidth/im.naturalHeight).toFixed(3)),size_bytes:f.size,size_display:fmt(f.size),status:classify(im.naturalWidth,im.naturalHeight),sha256:h,exact_duplicate_of:dup?.file||null};report.push(entry);const card=document.createElement('div');card.className='card';card.innerHTML='<img src="'+src+'"><b>'+entry.file.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</b><p class="small">'+entry.width+' × '+entry.height+' · '+entry.ratio+' ratio · '+entry.size_display+'</p><p><b>'+entry.status+(entry.exact_duplicate_of?' · DUPLICATE of '+entry.exact_duplicate_of:'')+'</b></p>'; $('cards').append(card)}catch(err){report.push({file:f.name,error:String(err),status:'ERROR'})}}const counts={good:report.filter(x=>x.status==='GOOD').length,review:report.filter(x=>x.status==='REVIEW').length,low:report.filter(x=>x.status==='LOW RES').length,duplicates:report.filter(x=>x.exact_duplicate_of).length,errors:report.filter(x=>x.status==='ERROR').length};$('status').textContent=report.length+' assets checked\nGood resolution: '+counts.good+'\nReview aspect/resolution: '+counts.review+'\nLow resolution: '+counts.low+'\nExact duplicates: '+counts.duplicates+'\nErrors: '+counts.errors+'\n\nQC is technical only: it does not judge product authenticity, licensing, visual quality or whether a side view is accurate.'};
$('report').onclick=()=>{if(!report.length)return alert('Import images first');const out={tool:'HFX Phase 14 Asset QC',generated_at:new Date().toISOString(),scope:'local file metadata and exact duplicate hashes only',assets:report};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='hfx-asset-qc-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
$('clear').onclick=()=>{report=[];$('cards').innerHTML='';$('files').value='';$('status').textContent='Report cleared.'};
</script></main></body></html>
