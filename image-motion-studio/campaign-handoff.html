<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFX Campaign Handoff · Phase 15</title><style>
:root{color-scheme:dark;--bg:#080b13;--panel:#121a29;--line:#30435e;--accent:#a5eaff;--muted:#a9b7cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#27315c,#080b13 55%);color:#f6f8ff;font:14px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:15px}.panel{background:#111827ed;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.head{display:flex;gap:12px;align-items:center}.mark{padding:10px;border-radius:12px;background:linear-gradient(135deg,#a5eaff,#c2aaff);color:#07101a;font-weight:950}.eyebrow{color:var(--accent);font-size:10px;font-weight:850;letter-spacing:.15em}h1{margin:0;font-size:22px}.muted{color:var(--muted)}input,textarea{width:100%;background:#07101c;color:white;border:1px solid #344760;border-radius:8px;padding:9px}button{background:linear-gradient(100deg,#a5eaff,#c2aaff);color:#07101a;border:0;border-radius:9px;padding:10px 13px;font-weight:850;cursor:pointer}.secondary{background:#263750;color:white;border:1px solid #435a7a}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.buttons button{flex:1}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.shot{border:1px solid #344760;background:#0b1321;border-radius:10px;padding:10px}.shot img{width:100%;height:170px;object-fit:contain;background:#02050a;border-radius:7px}.move{display:flex;gap:7px}.move button{flex:1;padding:8px}.small{font-size:11px;color:var(--muted)}@media(max-width:450px){main{padding:10px}}
</style></head><body><main><div class="head"><div class="mark">HFX</div><div><div class="eyebrow">PHASE 15 · CAMPAIGN HANDOFF</div><h1>Shot Order & Storyboard Pack</h1></div></div><p class="muted">Import reference images, reorder shots with up/down controls, write a shot note, and export a self-contained storyboard JSON with embedded image data. No accounts or network requests.</p><div class="panel"><label>Campaign / Product title</label><input id="campaign" value="Product campaign"><label style="display:block;margin-top:8px">Campaign brief / objective</label><textarea id="brief" rows="3" placeholder="Describe the campaign objective, audience and creative direction."></textarea><label style="display:block;margin-top:8px">Import images</label><input id="files" type="file" accept="image/*" multiple><div class="buttons"><button id="export">Export storyboard JSON</button><button class="secondary" id="clear">Clear</button></div><div id="status" class="small">No images loaded.</div></div><div id="shots" class="shots"></div></main><script>
const $=id=>document.getElementById(id);let shots=[];function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const root=$('shots');root.innerHTML='';shots.forEach((s,i)=>{const card=document.createElement('div');card.className='shot';card.innerHTML='<img src="'+s.data+'"><b>Shot '+(i+1)+'</b><p><input data-note="'+i+'" value="'+esc(s.note)+'" placeholder="Shot intention / camera note"></p><div class="move"><button class="secondary" data-up="'+i+'">↑ Move up</button><button class="secondary" data-down="'+i+'">↓ Move down</button></div>';root.append(card)});root.querySelectorAll('[data-note]').forEach(el=>el.onchange=()=>shots[Number(el.dataset.note)].note=el.value);root.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{let i=+el.dataset.up;if(i>0){[shots[i-1],shots[i]]=[shots[i],shots[i-1]];render()}});root.querySelectorAll('[data-down]').forEach(el=>el.onclick=()=>{let i=+el.dataset.down;if(i<shots.length-1){[shots[i+1],shots[i]]=[shots[i],shots[i+1]];render()}})}
$('files').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;shots.push({filename:f.name,note:'',data:await read(f)})}render();$('status').textContent=shots.length+' shots ready. Use arrows to set intended order.'};function read(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$('export').onclick=()=>{if(!shots.length)return alert('Import images first.');const pack={format:'HFX storyboard package',version:1,created_at:new Date().toISOString(),campaign:$('campaign').value,brief:$('brief').value,canvas:{recommended:'1080x1920',orientation:'portrait'},shots:shots.map((s,i)=>({order:i+1,filename:s.filename,note:s.note,image_data_url:s.data}))};const blob=new Blob([JSON.stringify(pack)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hfx-storyboard-package.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);$('status').textContent='Storyboard package exported. Embedded images make the JSON file large; keep a backup.'};
$('clear').onclick=()=>{shots=[];$('shots').innerHTML='';$('files').value='';$('campaign').value='Product campaign';$('brief').value='';$('status').textContent='Cleared.'};
</script></main></body></html>
