name: Megamix zero-cost advert render

on:
  push:
    branches: [megamix-handsfree-build, production-studio-foundation]
    paths:
      - "megamix-ad/**"
      - ".github/workflows/megamix-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production project
        uses: actions/checkout@v4
      - name: Map uploaded brand photos to production asset names
        run: |
          set -euo pipefail
          mkdir -p megamix-ad/assets
          cp megamix-ad/assets/IMG-20261029-WA0016.jpg megamix-ad/assets/megamix-range.jpg
          cp megamix-ad/assets/IMG-20261029-WA0016.jpg megamix-ad/assets/megamix-range-endcard.jpg
          cp megamix-ad/assets/IMG-20261029-WA0017.jpg megamix-ad/assets/megamix-greek.jpg
          cp megamix-ad/assets/IMG-20261030-WA0007.jpg megamix-ad/assets/megamix-logo.jpg
          test -s megamix-ad/assets/megamix-range.jpg
          test -s megamix-ad/assets/megamix-greek.jpg
          test -s megamix-ad/assets/megamix-logo.jpg
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: megamix-ad/package.json
      - name: Install free media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip zip
          python -m pip install --break-system-packages requests beautifulsoup4
      - name: Acquire commercial-use stock footage
        run: python megamix-ad/scripts/fetch_stock.py
      - name: Normalize stock footage for frame-accurate rendering
        run: |
          set -euo pipefail
          for input in megamix-ad/assets/yoghurt-preparation.mp4 megamix-ad/assets/yoghurt-fruit-bowl.mp4; do
            output="${input%.mp4}.normalized.mp4"
            ffmpeg -y -i "$input" -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -r 30 -g 30 -keyint_min 30 -sc_threshold 0 -movflags +faststart "$output"
            mv "$output" "$input"
          done
      - name: HyperFrames project check
        working-directory: megamix-ad
        run: npm run check
      - name: Capture visual snapshots
        working-directory: megamix-ad
        run: npm run snapshot
      - name: Render vertical MP4 with HyperFrames
        working-directory: megamix-ad
        run: npm run render
      - name: Validate render
        run: |
          set -euo pipefail
          VIDEO="$(find megamix-ad/renders -maxdepth 1 -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json "$VIDEO" | tee megamix-ad/renders/ffprobe.json
          python megamix-ad/scripts/validate_render.py "$VIDEO"
          cp "$VIDEO" megamix-ad/renders/Megamix-Advert-1080x1920.mp4
      - name: Package delivery ZIP
        if: success()
        run: |
          cd megamix-ad
          zip -r ../Megamix-Advert-Delivery.zip renders assets/licence-manifest.csv production-notes.md
      - name: Upload MP4, snapshots and ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megamix-advert-delivery
          path: |
            Megamix-Advert-Delivery.zip
            megamix-ad/renders/**
            megamix-ad/.hyperframes/**
          if-no-files-found: warn
          retention-days: 14
