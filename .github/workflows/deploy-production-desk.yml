name: Deploy HFX Production Desk to GitHub Pages

on:
  push:
    branches:
      - feature/image-motion-studio
    paths:
      - "image-motion-studio/**"
      - ".github/workflows/deploy-production-desk.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML studios
        run: node tools/check-browser-studios.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Production Desk
        uses: actions/upload-pages-artifact@v3
        with:
          path: image-motion-studio
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
