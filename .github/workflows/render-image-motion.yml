name: Render image-motion scene

on:
  push:
    paths:
      - "image-motion-studio/project/**"
      - "tools/package-render.mjs"
      - "image-motion-studio/PHASE11_RENDER_QC.md"
      - "image-motion-studio/editor/**"
      - "image-motion-studio/3d-engine.html"
      - "image-motion-studio/render-pipeline.html"
      - "image-motion-studio/hfx-hyperframes-exporter.html"
      - "image-motion-studio/production-intelligence.html"
      - "image-motion-studio/audio-studio.html"
      - "image-motion-studio/PHASE10_AUDIO_STUDIO.md"
      - "image-motion-studio/PHASE9_PRODUCTION_INTELLIGENCE.md"
      - "image-motion-studio/README.md"
      - "image-motion-studio/PHASE7_RENDER_PIPELINE.md"
      - "image-motion-studio/PHASE8_HYPERFRAMES_EXPORTER.md"
      - "tools/check-browser-studios.mjs"
      - ".github/workflows/render-image-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-motion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-motion-studio/project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser studio modules
        run: node ../../tools/check-browser-studios.mjs
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check HyperFrames composition
        run: npm run check
      - name: Render MP4
        run: npm run render
      - name: Package MP4 and run media quality checks
        run: node ../../tools/package-render.mjs
      - name: Upload rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-motion-render-${{ github.run_number }}
          path: |
            image-motion-studio/project/**/*.mp4
            image-motion-studio/project/output/**
            image-motion-studio/project/output/delivery/**
          if-no-files-found: warn
          retention-days: 7
